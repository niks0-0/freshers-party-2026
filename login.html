<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login — CRUD 2026</title>
  <link rel="stylesheet" href="css/style.css?v=2.1">
  <link rel="stylesheet" href="css/auth.css?v=2.1">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-logo">
        <span>CRUD 2026</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="index.html#register" class="nav-link">Register</a></li>
      </ul>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Student <span class="gradient-text">Login</span></h2>
        <p>Enter your account credentials to access your ticket</p>
      </div>

      <!-- Password Notice Box -->
      <div style="padding: 0.85rem 1rem; background: rgba(99, 102, 241, 0.12); border: 1px solid rgba(99, 102, 241, 0.35); border-radius: var(--radius-md); font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.25rem; text-align: center;">
        🔑 Default Student Password: <strong style="color: #a5b4fc;">Freshers@2026</strong>
      </div>

      <form id="student-login-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="registered.email@example.com" required>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label for="login-password">Password</label>
            <a href="forgot-password.html" class="auth-link" style="font-size: 0.8rem;">Forgot Password?</a>
          </div>
          <div class="password-input-group">
            <input type="password" id="login-password" placeholder="••••••••" required style="padding-right: 2.8rem;">
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('login-password', this)">👁️</button>
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-full" style="margin-top: 1rem;">
          LOGIN TO DASHBOARD
        </button>
      </form>

      <div class="auth-footer">
        <span>Haven't registered for CRUD 2026 yet?</span>
        <a href="index.html#register" class="auth-link">Register Here</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>© 2026 CRUD 2026 Digital Portal • Crafted by <span class="credit-tag">NIKSLAB</span></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=2.1"></script>
  <script src="js/supabase.js?v=2.1"></script>
  <script src="js/ui-helpers.js?v=2.1"></script>
  <script src="js/auth.js?v=2.1"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('student-login-form');
      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('login-submit-btn');
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        setButtonLoading(submitBtn, true, 'Authenticating...');

        const result = await loginUser(email, password, false);
        setButtonLoading(submitBtn, false);

        if (!result.success) {
          showToast(result.message, 'error');
        } else {
          showToast('Login successful! Welcome back.', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        }
      });
    });
  </script>
</body>
</html>
