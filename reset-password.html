<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — Freshers Party 2026</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-logo">
        <span>FRESHERS 2026</span>
      </a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Set New <span class="gradient-text">Password</span></h2>
        <p>Type your new password below</p>
      </div>

      <form id="update-password-form">
        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" placeholder="Minimum 6 characters" minlength="6" required>
        </div>

        <button type="submit" id="update-pass-submit-btn" class="btn btn-primary btn-full" style="margin-top: 1rem;">
          UPDATE PASSWORD
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/ui-helpers.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.getElementById('update-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('update-pass-submit-btn');
      const pass = document.getElementById('new-password').value;

      setButtonLoading(submitBtn, true, 'Updating...');
      const res = await updatePassword(pass);
      setButtonLoading(submitBtn, false);

      if (res.success) {
        showToast(res.message, 'success');
        setTimeout(() => window.location.href = 'login.html', 1500);
      } else {
        showToast(res.message, 'error');
      }
    });
  </script>
</body>
</html>
