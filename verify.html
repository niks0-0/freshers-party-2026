<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verification — CRUD 2026</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <nav class="navbar">
    <div class="container nav-container">
      <a href="dashboard.html" class="nav-logo">
        <span>CRUD 2026</span>
      </a>
      <ul class="nav-links">
        <li><a href="dashboard.html" class="nav-link">← Dashboard</a></li>
      </ul>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 460px; text-align: center;">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--primary);">📧</div>
      <h2 style="margin-bottom: 0.5rem;">VERIFY YOUR <span class="gradient-text">EMAIL</span></h2>
      <p style="font-size: 0.875rem; margin-bottom: 1.5rem;">
        We sent a 6-digit security verification code to: <br>
        <strong id="masked-email-display" style="color: var(--text-main); font-size: 1rem;">n*********5@gmail.com</strong>
      </p>

      <form id="verify-otp-form">
        <div class="otp-container">
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required autofocus>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" required>
        </div>

        <button type="submit" id="verify-submit-btn" class="btn btn-primary btn-full" style="padding: 0.9rem; font-size: 1rem; margin-bottom: 1.5rem;">
          VERIFY & UNLOCK TICKET
        </button>
      </form>

      <div class="resend-timer">
        <span id="resend-timer-text">Resend available in 60s</span> <br>
        <button id="resend-code-btn" class="btn btn-sm btn-secondary" style="margin-top: 0.5rem;" disabled>Resend Code</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/ui-helpers.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/verify.js"></script>

</body>
</html>
