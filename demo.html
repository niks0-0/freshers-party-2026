<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRUD 2026 — Live Stage Lasers & Party Countdown</title>
  <link rel="stylesheet" href="css/style.css?v=22.0">
  <style>
    /* =========================================================
       MOBILE-FIRST CONCERT STAGE LASERS & LIVE PARTY COUNTDOWN
       ========================================================= */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background: #060911;
      color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* 1. Stage Atmosphere & Spotlights (Optimized for Mobile GPU) */
    .stage-ambient-fog {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: 
        radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.25) 0%, transparent 60%),
        radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 20%, rgba(236, 72, 153, 0.18) 0%, transparent 40%),
        #060911;
      z-index: 0;
      pointer-events: none;
    }

    /* 2. Mobile-Smooth Concert Stage Laser Beams */
    .laser-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .laser {
      position: absolute;
      top: -60px;
      width: 3px;
      height: 120vh;
      transform-origin: top center;
      filter: blur(1px);
    }

    /* Left Cyan Laser */
    .laser-cyan {
      left: 15%;
      background: linear-gradient(180deg, #38bdf8 0%, rgba(56, 189, 248, 0.6) 40%, transparent 90%);
      box-shadow: 0 0 20px 4px rgba(56, 189, 248, 0.5);
      animation: laserSweepLeft 4.5s ease-in-out infinite alternate;
    }

    /* Right Magenta Laser */
    .laser-magenta {
      right: 15%;
      background: linear-gradient(180deg, #ec4899 0%, rgba(236, 72, 153, 0.6) 40%, transparent 90%);
      box-shadow: 0 0 20px 4px rgba(236, 72, 153, 0.5);
      animation: laserSweepRight 5.2s ease-in-out infinite alternate;
    }

    /* Center Violet Laser Sweep */
    .laser-violet {
      left: 50%;
      background: linear-gradient(180deg, #a855f7 0%, rgba(168, 85, 247, 0.6) 50%, transparent 90%);
      box-shadow: 0 0 25px 6px rgba(168, 85, 247, 0.4);
      animation: laserSweepCenter 6s ease-in-out infinite alternate;
    }

    @keyframes laserSweepLeft {
      0% { transform: rotate(-30deg); opacity: 0.4; }
      50% { transform: rotate(10deg); opacity: 0.9; }
      100% { transform: rotate(35deg); opacity: 0.5; }
    }

    @keyframes laserSweepRight {
      0% { transform: rotate(30deg); opacity: 0.5; }
      50% { transform: rotate(-15deg); opacity: 0.95; }
      100% { transform: rotate(-35deg); opacity: 0.4; }
    }

    @keyframes laserSweepCenter {
      0% { transform: rotate(-18deg); opacity: 0.3; }
      50% { transform: rotate(18deg); opacity: 0.8; }
      100% { transform: rotate(-10deg); opacity: 0.4; }
    }

    /* 3. Mobile UI Wrapper */
    .mobile-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      padding: 2rem 1.25rem;
      margin: 0 auto;
      text-align: center;
    }

    /* 4. Live Countdown Main Glass Card */
    .countdown-card {
      background: rgba(13, 18, 30, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 2rem 1.25rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(99, 102, 241, 0.2);
      margin-top: 1.5rem;
    }

    /* 5. Mobile Countdown Grid */
    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
      margin: 1.5rem 0 1rem;
    }

    .time-box {
      background: rgba(8, 12, 22, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      padding: 1rem 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.08), 0 8px 20px rgba(0,0,0,0.4);
      position: relative;
      overflow: hidden;
    }

    .time-box::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #38bdf8, transparent);
    }

    .time-num {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 30%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-variant-numeric: tabular-nums;
    }

    .time-label {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 0.45rem;
    }

    /* Live Pulsing Badge */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 1rem;
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(236, 72, 153, 0.15);
      border: 1px solid rgba(236, 72, 153, 0.4);
      color: #f472b6;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.25);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ec4899;
      box-shadow: 0 0 10px #ec4899;
      animation: pulseAnim 1.2s infinite;
    }

    @keyframes pulseAnim {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.4); }
    }
  </style>
</head>
<body>

  <!-- Ambient Fog Background -->
  <div class="stage-ambient-fog"></div>

  <!-- Concert Laser Beams -->
  <div class="laser-container">
    <div class="laser laser-cyan"></div>
    <div class="laser laser-violet"></div>
    <div class="laser laser-magenta"></div>
  </div>

  <div class="mobile-container">
    
    <!-- Status Pill -->
    <span class="live-badge">
      <span class="pulse-dot"></span> OFFICIAL COUNTDOWN
    </span>

    <h1 style="font-size: 2.25rem; margin: 1rem 0 0.3rem; font-weight: 900; letter-spacing: -0.5px; line-height: 1.15;">
      CRUD 2026 <span class="gradient-text">Starts In</span>
    </h1>
    <p style="color: #94a3b8; font-size: 1rem; margin: 0 0 1.25rem; font-weight: 600;">
      August 21 • 12:30 PM Onwards
    </p>

    <!-- Main Countdown Card -->
    <div class="countdown-card">
      
      <div style="font-size: 0.8rem; font-weight: 800; letter-spacing: 1.5px; color: #38bdf8; text-transform: uppercase;">
        ⚡ OFFICIAL EVENT CLOCK
      </div>

      <!-- 3-Column Mobile Timer Grid -->
      <div class="countdown-grid">
        <div class="time-box">
          <span class="time-num" id="timer-hours">--</span>
          <span class="time-label">HOURS</span>
        </div>
        <div class="time-box">
          <span class="time-num" id="timer-minutes">--</span>
          <span class="time-label">MINUTES</span>
        </div>
        <div class="time-box">
          <span class="time-num" id="timer-seconds">--</span>
          <span class="time-label">SECONDS</span>
        </div>
      </div>

      <div id="countdown-status-text" style="font-size: 0.95rem; color: #f1f5f9; font-weight: 600; margin-top: 0.75rem; line-height: 1.4;">
        Get your passes ready & bring the energy! 🔥🕺
      </div>

      <div style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.65rem;">
        <a href="login.html" class="btn btn-primary btn-full">
          ACCESS MY PASS 🎟️
        </a>
        <a href="index.html" class="btn btn-secondary btn-full" style="font-size: 0.85rem;">
          ← Event Details & Guidelines
        </a>
      </div>

    </div>

    <div style="margin-top: 2rem; font-size: 0.75rem; color: #64748b;">
      © 2026 Department of Computer Science • Crafted by <span style="color: #a5b4fc; font-weight: 600;">NIKSLAB</span>
    </div>

  </div>

  <!-- Countdown Clock Logic -->
  <script>
    // Target: Tomorrow (Aug 21) at 12:30 PM Afternoon
    const targetDate = new Date();
    targetDate.setDate(targetDate.getDate() + 1);
    targetDate.setHours(12, 30, 0, 0);

    function updateCountdown() {
      const now = new Date().getTime();
      const diff = targetDate.getTime() - now;

      const hoursEl = document.getElementById('timer-hours');
      const minutesEl = document.getElementById('timer-minutes');
      const secondsEl = document.getElementById('timer-seconds');
      const statusText = document.getElementById('countdown-status-text');

      if (diff <= 0) {
        if (hoursEl) hoursEl.textContent = '00';
        if (minutesEl) minutesEl.textContent = '00';
        if (secondsEl) secondsEl.textContent = '00';
        if (statusText) statusText.innerHTML = '🎉 <strong>THE FRESHERS PARTY HAS OFFICIALLY BEGUN! 🕺💃</strong>';
        return;
      }

      const totalHours = Math.floor(diff / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      if (hoursEl) hoursEl.textContent = String(totalHours).padStart(2, '0');
      if (minutesEl) minutesEl.textContent = String(minutes).padStart(2, '0');
      if (secondsEl) secondsEl.textContent = String(seconds).padStart(2, '0');
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>

</body>
</html>
