<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Freshers Party 2026</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-logo">
        <span>FRESHERS 2026</span>
      </a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Reset <span class="gradient-text">Password</span></h2>
        <p>Enter your registered email to receive a password reset link</p>
      </div>

      <form id="forgot-password-form">
        <div class="form-group">
          <label for="reset-email">Email Address</label>
          <input type="email" id="reset-email" placeholder="your.email@example.com" required>
        </div>

        <button type="submit" id="reset-submit-btn" class="btn btn-primary btn-full" style="margin-top: 1rem;">
          SEND RESET LINK
        </button>
      </form>

      <div class="auth-footer">
        <a href="login.html" class="auth-link">← Back to Login</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/ui-helpers.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('reset-submit-btn');
      const email = document.getElementById('reset-email').value.trim();

      setButtonLoading(submitBtn, true, 'Sending link...');
      const res = await sendPasswordReset(email);
      setButtonLoading(submitBtn, false);

      if (res.success) {
        showToast(res.message, 'success');
      } else {
        showToast(res.message, 'error');
      }
    });
  </script>
</body>
</html>
