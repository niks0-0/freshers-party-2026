<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Freshers Party 2026</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

  <nav class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="nav-logo">
        <span>FRESHERS 2026</span>
        <span class="logo-badge" style="background: var(--accent);">ADMIN</span>
      </a>
      <ul class="nav-links">
        <li><a href="../index.html" class="nav-link">Main Portal</a></li>
      </ul>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card" style="border-top: 4px solid var(--accent);">
      <div class="auth-header">
        <h2>Administrator <span class="gradient-text">Portal</span></h2>
        <p>Log in with authorized event management credentials</p>
      </div>

      <form id="admin-login-form">
        <div class="form-group">
          <label for="admin-email">Admin Email</label>
          <input type="email" id="admin-email" placeholder="admin@freshers2026.com" required>
        </div>

        <div class="form-group">
          <label for="admin-password">Password</label>
          <input type="password" id="admin-password" placeholder="••••••••" required>
        </div>

        <button type="submit" id="admin-login-submit-btn" class="btn btn-primary btn-full" style="margin-top: 1rem; background: linear-gradient(135deg, var(--accent), var(--primary));">
          ADMIN LOGIN
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/ui-helpers.js"></script>
  <script src="../js/auth.js"></script>

  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('admin-login-submit-btn');
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;

      setButtonLoading(submitBtn, true, 'Authenticating Admin...');

      const result = await loginUser(email, password, true);
      setButtonLoading(submitBtn, false);

      if (!result.success) {
        showToast(result.message, 'error');
      } else {
        showToast('Admin authorization successful!', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);
      }
    });
  </script>

</body>
</html>
